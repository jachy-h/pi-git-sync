name: Test

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Linux / Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Configure Git identity
        run: |
          git config --global user.name "pi-git-sync CI"
          git config --global user.email "ci@pi-git-sync.invalid"
      - run: npm run test:ci

  platform-smoke:
    name: ${{ matrix.os }} / Node 22
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Configure Git identity
        run: |
          git config --global user.name "pi-git-sync CI"
          git config --global user.email "ci@pi-git-sync.invalid"
      - run: npm run typecheck
      - run: npm run test:smoke -- --reporter=dot

  package:
    name: Package contents
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Configure Git identity
        run: |
          git config --global user.name "pi-git-sync CI"
          git config --global user.email "ci@pi-git-sync.invalid"
      - run: npm pack --dry-run
